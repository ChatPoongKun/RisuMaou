<style>
.disposal-header {
margin-bottom: 1rem;
}
.disposal-header h1 {
font-size: 1.2rem;
color: #60d9f7;
margin: 0;
}
.disposal-methods {
margin-top: 1rem;
padding: 1rem;
background: #1a1a1a;
border-left: 3px solid #ff6b6b;
}
.disposal-methods h3 {
color: #ff6b6b;
margin: 0 0 0.5rem 0;
font-size: 1rem;
}
.disposal-result-box {
background: #1a1a1a;
padding: 1rem;
border-left: 3px solid #4caf50;
margin: 1rem 0;
}
.disposal-result-box h3 {
color: #4caf50;
margin: 0 0 0.5rem 0;
}
.disposal-description {
color: #ccc;
line-height: 1.6;
margin-bottom: 1rem;
padding: 0.5rem;
background: #222;
border-radius: 4px;
}
.spirit-gain {
color: #ffc107;
font-weight: bold;
}
.spirit-gain .breakdown {
font-size: 0.8rem;
color: #888;
font-weight: normal;
}
.loading-text {
text-align: center;
color: #888;
padding: 2rem;
}
.x-risu-progress-bar {
height: 0.3rem !important;
}
</style>
<div class="container">
<header class="disposal-header">
<h1>▋ 포로 처분</h1>
</header>
<div class="tabs-container">
<div class="tabs {{#if {{equal::{{getvar::category}}::index}}}}active{{/if}}" risu-btn="sort_index">획득순</div>
<div class="tabs {{#if {{equal::{{getvar::category}}::name}}}}active{{/if}}" risu-btn="sort_name">이름</div>
<div class="tabs {{#if {{equal::{{getvar::category}}::level}}}}active{{/if}}" risu-btn="sort_level">레벨</div>
<div class="tabs {{#if {{equal::{{getvar::category}}::rating}}}}active{{/if}}" risu-btn="sort_rating">레이팅</div>
</div>
<main class="info-grid" style="grid-template-columns: 1fr;">
{{getvar::charList}}
</main>
{{#when::disposal_phase::vis::method}}
<div class="disposal-methods">
<h3>{{getvar::targetName}} 처분 방법 선택</h3>
{{getvar::methodList}}
</div>
{{/when}}
{{#when::disposal_phase::vis::result}}
{{getvar::disposalResult}}
{{/when}}
<div class="line double"></div>
{{getvar::cmds}}
</div>
