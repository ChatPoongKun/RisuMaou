<style>
    /* Global & Layout */
    body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        color: #ccc;
        height: 100vh;
        overflow: hidden;
        font-family: 'Noto Sans KR', sans-serif;
    }

    .battle-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 0.5rem;
        box-sizing: border-box;
        position: relative;
        /* Container Shake Animation triggered periodically */
        animation: container-shock 4s infinite; /* Base subtle movement */
    }
    
    /* 
        Simulate impact on log batch arrival.
        Each batch arrives every 1.0s. 
        We use a CSS animation on the container or a overlay to shake.
        Since we can't trigger JS, we use a looped animation.
        If batch interval is 1.0s, we set animation duration to 1.0s.
        We limit iterations using {{getvar::shakeCount}} so it stops after logs finish.
    */
    @keyframes periodic-impact {
        0% { transform: translate(0, 0); filter: brightness(1); }
        5% { transform: translate(-2px, 1px); filter: brightness(1.2); }
        10% { transform: translate(2px, -1px); filter: brightness(1.5); }
        15% { transform: translate(-2px, 2px); filter: brightness(1.2); }
        20% { transform: translate(2px, -2px); filter: brightness(1.1); }
        25%, 100% { transform: translate(0, 0); filter: brightness(1); }
    }
    
    .impact-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        animation: periodic-impact 1s {{getvar::shakeCount}};
        animation-fill-mode: forwards;
    }

    /* Top: Dungeon Status (Compact) */
    .dungeon-status-strip {
        flex: 0 0 auto;
        background: #111;
        border: 1px solid #333;
        padding: 0.5rem;
        margin-bottom: 0.5rem;
        overflow-x: auto;
        white-space: nowrap;
        /* Reuse dungeon styles */
    }
    
    /* Reuse styles from Dungeon.html for the grid strip */
    .dungeon-status-strip .floor-wrapper { display: inline-flex; margin-right: 1rem; vertical-align: top; background: #1a1a1a; padding: 4px; border: 1px solid #333; }
    .dungeon-status-strip .floor-header { font-size: 0.8rem; font-weight: bold; color: #60d9f7; margin-bottom: 2px; text-align: center;}
    .dungeon-status-strip .floor-slots { display: flex; gap: 2px; }
    .dungeon-status-strip .d-slot { width: 30px; height: 30px; background: #000; border: 1px solid #333; position: relative; display: flex; justify-content: center; align-items: center; }
    .dungeon-status-strip .d-slot img { width: 100%; height: 100%; object-fit: cover; }
    .dungeon-status-strip .floor-right { display: none; } /* Hide synergy text for compact view */

    /* Middle: Battle Scene */
    .battle-scene {
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        padding: 1rem 0;
        position: relative;
    }
    
    .fighter-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        position: relative;
        /* Icon Shake synced with periodic impact */
        animation: icon-shock 1s {{getvar::shakeCount}};
        animation-fill-mode: forwards;
    }
    
    @keyframes icon-shock {
        0% { transform: scale(1); }
        5% { transform: scale(1.1) rotate(-3deg); }
        10% { transform: scale(0.95) rotate(3deg); }
        15% { transform: scale(1.05); }
        20%, 100% { transform: scale(1); }
    }

    .fighter-icon {
        width: 100px;
        height: 100px;
        background-color: #222;
        border: 3px solid #444;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        position: relative;
    }
    
    .fighter-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    /* Flash effect overlay inside icon */
    .fighter-icon::after {
        content: "";
        position: absolute;
        inset: 0;
        background: white;
        opacity: 0;
        animation: periodic-flash 1s {{getvar::shakeCount}};
        animation-fill-mode: forwards;
    }
    
    @keyframes periodic-flash {
        0% { opacity: 0; }
        5% { opacity: 0.8; }
        20%, 100% { opacity: 0; }
    }

    .fighter-name { font-weight: bold; font-size: 1rem; color: #ddd; text-shadow: 1px 1px 2px black; }
    .fighter-role { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    .vs-badge {
        font-size: 2.5rem;
        font-weight: 900;
        color: #d32f2f; /* Red for aggressive feel */
        text-shadow: 0 0 10px #d32f2f;
        animation: pulse-vs 0.5s infinite alternate;
    }
    
    @keyframes pulse-vs {
        from { transform: scale(1); text-shadow: 0 0 10px #d32f2f; }
        to { transform: scale(1.2); text-shadow: 0 0 20px #ff5252; }
    }

    /* Bottom: Logs */
    .log-container {
        flex: 1;
        background-color: rgba(0,0,0,0.6);
        border: 1px solid #333;
        padding: 1rem;
        overflow-y: auto;
        font-family: 'Consolas', monospace;
        font-size: 0.95rem;
        display: flex;
        flex-direction: column;
        gap: 2px; /* Close gap for batch feel */
        mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); /* Fade edges */
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    }

    .log-line {
        opacity: 0;
        transform: translateX(-20px);
        animation: batch-slide-in 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        line-height: 1.5;
        padding: 2px 0;
        border-bottom: 1px solid #111;
    }
    
    .log-line.victory { color: #81c784; text-shadow: 0 0 5px rgba(76, 175, 80, 0.3); }
    .log-line.danger { color: #ff8a80; text-shadow: 0 0 5px rgba(211, 47, 47, 0.3); }
    .log-line.highlight { color: #60d9f7; font-weight: bold; border-left: 3px solid #60d9f7; padding-left: 8px; margin-top: 8px; margin-bottom: 4px; background: rgba(96, 217, 247, 0.1); }

    @keyframes batch-slide-in {
        to { opacity: 1; transform: translateX(0); }
    }
    
    /* Result & Close Button Section */
    .result-section {
        flex: 0 0 auto;
        text-align: center;
        padding: 1rem;
        opacity: 0;
        transform: translateY(20px);
        animation: reveal-result 0.5s forwards;
        animation-delay: {{getvar::animDuration}}; 
        /* Hidden initially, distinct from overlay approach */
        background: #111;
        border-top: 1px solid #333;
    }
    
    @keyframes reveal-result {
        to { opacity: 1; transform: translateY(0); }
    }

    .result-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
    .result-title.victory { color: #60d9f7; }
    .result-title.defeat { color: #d32f2f; }

    .close-btn {
        background: #222;
        color: #ddd;
        border: 1px solid #444;
        padding: 0.8rem 3rem;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
    }
    .close-btn:hover { background: #333; border-color: #666; color: #fff; }
</style>

<div class="container">
<div class="impact-layer"></div> <!-- Visual Shake Layer -->

<div class="battle-container">
<!-- 1. Dungeon Status Strip -->
<div class="dungeon-status-strip">
{{getvar::dungeonStatusHtml}}
</div>

<!-- 2. Battle Scene -->
<div class="battle-scene">
<!-- Hero (Invader) -->
<div class="fighter-container">
<div class="fighter-role">INVADER</div>
<div class="fighter-icon">
<img src="../../Pages/images/icon_sword.png" onerror="this.src='https://via.placeholder.com/100/333/fff?text=HERO'"> <!-- Fallback/Default -->
<!-- Ideally we'd pass a hero image if available, but for now generic or first hero -->
</div>
<!-- <div class="fighter-name">{{getvar::currentHeroName}}</div> -->
<!-- Removed Name to reduce clutter or keep simple -->
</div>

<div class="vs-badge">VS</div>

<!-- Monster (Defender/User) -->
<div class="fighter-container">
<div class="fighter-role">DEFENDER</div>
<div class="fighter-icon">
<img src="{{source::user}}"> <!-- User's Portrait -->
</div>
<!-- <div class="fighter-name">{{getvar::userName}}</div> -->
</div>
</div>

<!-- 3. Logs -->
<div class="line single"></div>
<div class="log-container">
{{getvar::battleLogsHtml}}
<div style="height: 50px;"></div> <!-- Spacer -->
</div>

<!-- 4. Result/Close (Bottom, Inline) -->
<div class="result-section">
<div class="result-title {{#when {{equal::{{getvar::battleResult}}::BadEnding}}}}defeat{{:else}}victory{{/when}}">
{{#if {{equal::{{getvar::battleResult}}::BadEnding}}}}DEFEAT...{{:else}}VICTORY!{{/if}}
</div>
<button class="close-btn" risu-btn="close">전투 종료 및 확인</button>
</div>
</div>
</div>
